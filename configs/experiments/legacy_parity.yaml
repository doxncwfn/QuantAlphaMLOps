# Closest reproduction of the legacy pipeline (legacy/src) on the new data layer.
# Differs from baseline_hybrid in feature_spec (legacy inputs) and model_spec (hidden_dim 128).
# Same as legacy: model, loss, feature formulas, per-date z-score (ddof=1) + clip ±3, walk-forward folds.
# Different by design (docs/PLATFORM.md, "Legacy parity"):
#   - universe: top-k filter on the survivorship-free warehouse, not the yfinance strict intersection
#   - target: forward total return z-scored inside the loss; the legacy Fama-French residual is not ported
#   - checkpoints: chosen on a validation split, not on the test fold
# Paths: configs/env/<env>.yaml
name: legacy_parity
seed: 42

# ------------------------------------------------------------------ data
data_spec:
  dataset_name: r1000_topk
  source:
    func: warehouse_duckdb
  period:
    start: 2000-07-01
    end: 2024-12-31
  warmup_days: 400

feature_spec:                         # legacy model inputs (log_ret was computed but not fed)
  - func: raw
    kwargs:
      column: open
  - func: raw
    kwargs:
      column: high
  - func: raw
    kwargs:
      column: low
  - func: raw
    kwargs:
      column: close
  - func: raw
    kwargs:
      column: volume
  - func: vol
    kwargs:
      n: 60
  - func: dist_sma
    kwargs:
      n: 20
  - func: dist_sma
    kwargs:
      n: 60

filter_spec:
  func: topk_dollar_volume
  kwargs:
    k: 500
    buffer_ratio: 0.1
    x: 20
    y: 30
    ttl: 21
    agg: sum
    on_delist: keep

indicator_spec: []

label_spec:
  func: forward_return
  kwargs:
    h: 5
    offset: 0

window_spec:
  lookback: 60
  max_missing: 2
  fill: zero
  transforms:
    - func: cs_zscore
      kwargs:
        ddof: 1
    - func: clip
      kwargs:
        lo: -3
        hi: 3

# ------------------------------------------------------------------ model
model_spec:
  func: hybrid_lstm_tfm
  kwargs:
    hidden_dim: 128
    lstm_layers: 2
    tfm_layers: 2
    heads: 4
    ff_dim: 128
    dropout: 0.2

loss_spec:
  func: hybrid_hinge
  kwargs:
    margin: 0.1
    decile: 0.1
    lambda_mse: 1.0
    target: zscore

# ------------------------------------------------------------------ training
split_spec:
  func: purged_walk_forward
  kwargs:
    n_folds: 5
    purge: 5
    embargo: 20
    val_frac: 0.15

train_spec:
  max_epochs: 15
  batch_dates: 32
  lr: 1.0e-4
  weight_decay: 1.0e-5
  lr_patience: 3
  lr_factor: 0.5
  monitor: val_ic
  early_stopping_patience: null
  min_valid_slots: 20
  accelerator: auto
  num_workers: 0
  deterministic: true

# ------------------------------------------------------------------ evaluation
evaluation_spec:
  metrics:
    - func: mean_ic
    - func: icir
      kwargs:
        periods_per_year: 50.4
    - func: ic_hit_rate
    - func: decile_spread
      kwargs:
        n: 10
        cost_bps: 10
    - func: decile_monotonicity
      kwargs:
        n: 10

backtest_spec:
  func: placeholder

tracking_spec:
  wandb:
    enabled: false
    project: HCMUT-Specialized-Project
    mode: online
