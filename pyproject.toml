[project]
name = "quant-alpha-mlops"
version = "0.1.0"
description = "Quantitative Alpha MLOps Platform"
requires-python = ">=3.11"
dependencies = [
  # Data Engineering & Preprocessing
  "numpy>=1.26.0,<2",
  "pandas>=2.2",
  "polars>=0.20.0",
  "pyarrow>=17.0",
  "pypdfium2>=4.27.0",

  # Deep Learning Engine
  "pytorch-lightning>=2.2.0",
  "torch>=2.2.0",

  # MLOps, Tracking, & Optimization
  "optuna>=3.5.0",
  "wandb>=0.16.0",

  # Explainable AI (XAI) & Baselines
  "captum>=0.7.0",
  "lightgbm>=4.3.0",
  "scipy>=1.12.0",

  # Plotting & Visualization
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0",

  # Infrastructure & Utilities
  "modal==1.5.3",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.3.0"
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "notebooks",
    "artifacts",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade (modern type hints and idioms)
    "C4",     # flake8-comprehensions
    "BLE",    # flake8-blind-except
    "SIM",    # flake8-simplify
    "TRY",    # tryceratops
    "G",      # flake8-logging-format
]
ignore = [
    "E501",   # Line length handled by formatter
    "E402",   # Module level import not at top of file (needed for CUDA env setup)
    "TRY003", # Avoid specifying long messages outside exception class
    "TRY300", # Consider moving statement to an else block
    "TRY301", # Abstract raise to an inner function
    "TRY400", # Use logging.exception instead of logging.error
]

[tool.ruff.lint.isort]
known-first-party = ["src", "tools", "analysis"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]